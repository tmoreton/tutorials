<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            color: #111;
        }
        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e5e5;
            font-weight: 600;
        }
        #chat { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .msg {
            max-width: 640px;
            margin: 0 auto 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .user { background: #111; color: #fff; margin-left: auto; max-width: 80%; }
        .bot { background: #f4f4f4; max-width: 80%; }
        #form {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            border-top: 1px solid #e5e5e5;
            max-width: 660px;
            margin: 0 auto;
            width: 100%;
        }
        #input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            background: #111;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:disabled { opacity: 0.4; }
    </style>
</head>
<body>
    <header>My AI Chat</header>
    <div id="chat"></div>
    <form id="form">
        <input id="input" placeholder="Ask me anything..." autocomplete="off" autofocus>
        <button type="submit">Send</button>
    </form>

    <script>
        // agentcore dev serves the agent here.
        const ENDPOINT = "http://localhost:8080/invocations";

        // A stable id so the agent keeps this tab's conversation history.
        const sessionId = "web-" + Math.random().toString(36).slice(2) + Date.now();

        const chat = document.getElementById("chat");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const button = form.querySelector("button");

        function addMessage(role, text) {
            const el = document.createElement("div");
            el.className = "msg " + role;
            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
            return el;
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            addMessage("user", text);
            input.value = "";
            button.disabled = true;
            const bot = addMessage("bot", "");

            try {
                const res = await fetch(ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "text/event-stream", // required: the agent streams SSE
                        "X-Amzn-Bedrock-AgentCore-Runtime-Session-Id": sessionId,
                    },
                    body: JSON.stringify({ prompt: text }),
                });

                // The response is a Server-Sent Events stream: `data: "token"` frames.
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const frames = buffer.split("\n\n");
                    buffer = frames.pop(); // keep any partial frame for next read
                    for (const frame of frames) {
                        const line = frame.split("\n").find((l) => l.startsWith("data:"));
                        if (line) {
                            bot.textContent += JSON.parse(line.slice(5).trim());
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                bot.textContent = "Something went wrong. Is `agentcore dev` running?";
            }

            button.disabled = false;
            input.focus();
        });
    </script>
</body>
</html>
