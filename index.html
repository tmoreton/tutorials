<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f9fafb;
            --text: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --user-bg: #2563eb;
            --user-text: #ffffff;
            --radius: 1rem;
            --max-width: 720px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        header svg { color: var(--accent); }
        header h1 {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        #chat:empty::before {
            content: "Ask Relay anything.";
            display: block;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.25rem;
            margin-top: 30vh;
        }

        .message-row {
            max-width: var(--max-width);
            margin: 0 auto 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .message-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding-left: 1rem;
        }

        .message-bubble {
            padding: 0.875rem 1rem;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 0.9375rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-row.user .message-bubble {
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 0.25rem;
            align-self: flex-end;
            max-width: 85%;
            margin-left: auto;
        }

        .message-row.assistant .message-bubble {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 0.25rem;
            max-width: 85%;
        }

        .thinking { color: var(--text-secondary); font-style: italic; }

        #input-area {
            padding: 1rem 1.5rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        #input-container {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.625rem 0.75rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.9375rem;
            padding: 0.375rem 0.25rem;
            font-family: inherit;
            resize: none;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.5;
        }
        #input::placeholder { color: var(--text-secondary); }

        #send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.15s;
        }
        #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        #send-btn:hover:not(:disabled) { transform: scale(1.05); }
        #send-btn:active:not(:disabled) { transform: scale(0.95); }

        #footer {
            text-align: center;
            padding: 0.5rem;
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }

        #chat::-webkit-scrollbar { width: 5px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            header { padding: 0.75rem 1rem; }
            #input-area { padding: 0.75rem 1rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
        </svg>
        <h1>Relay</h1>
    </header>

    <div id="chat"></div>

    <div id="input-area">
        <div id="input-container">
            <textarea id="input" rows="1" placeholder="Message Relay..."></textarea>
            <button id="send-btn" onclick="send()" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div id="footer">Powered by Strands Agents &middot; Amazon Bedrock</div>

    <script>
        // ── Configuration ──────────────────────────────────────────
        const API_URL = "http://localhost:8080/invocations";

        // ── Elements ───────────────────────────────────────────────
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send-btn");

        // Auto-resize textarea
        inputEl.addEventListener("input", () => {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
        });

        // Enter to send, Shift+Enter for newline
        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) send();
            }
        });

        // ── Send message ───────────────────────────────────────────
        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessage("user", text);
            inputEl.value = "";
            inputEl.style.height = "auto";
            sendBtn.disabled = true;

            const row = appendMessage("assistant", "Thinking...", "thinking");
            const bubble = row.querySelector(".message-bubble");

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: text }),
                });
                const data = await res.json();
                bubble.textContent = data.result;
                bubble.classList.remove("thinking");
            } catch (err) {
                bubble.textContent = "Something went wrong. Make sure agentcore dev is running.";
                bubble.classList.remove("thinking");
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        // ── Render message ─────────────────────────────────────────
        function appendMessage(role, text, className = "") {
            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = `message-bubble ${className}`;
            bubble.textContent = text;

            row.appendChild(bubble);
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
            return row;
        }

        // Focus input on load
        inputEl.focus();
    </script>
</body>
</html>
