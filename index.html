<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relay</title>
    <style>
        :root {
            --bg: #ffffff;
            --bg-secondary: #f5f5f5;
            --text: #111111;
            --text-secondary: #666666;
            --border: #e5e5e5;
            --accent: #111111;
            --user-bg: #111111;
            --user-text: #ffffff;
            --radius: 1rem;
            --max-width: 720px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        header .brand-icon { color: var(--accent); }
        header h1 {
            font-size: 1.125rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }
        #repo-link {
            margin-left: auto;
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            transition: color 0.15s;
        }
        #repo-link:hover { color: var(--accent); }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        #chat:empty::before {
            content: "Ask Relay anything.";
            display: block;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1.25rem;
            margin-top: 30vh;
        }

        .message-row {
            max-width: var(--max-width);
            margin: 0 auto 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .message-bubble {
            padding: 0.875rem 1rem;
            border-radius: var(--radius);
            line-height: 1.6;
            font-size: 0.9375rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-row.user .message-bubble {
            background: var(--user-bg);
            color: var(--user-text);
            border-bottom-right-radius: 0.25rem;
            align-self: flex-end;
            max-width: 85%;
            margin-left: auto;
        }

        .message-row.assistant .message-bubble {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 0.25rem;
            max-width: 85%;
        }

        .thinking { color: var(--text-secondary); font-style: italic; }

        #input-area {
            padding: 1rem 1.5rem 1.5rem;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        #input-container {
            max-width: var(--max-width);
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 0.5rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.625rem 0.75rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #input-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 0.9375rem;
            padding: 0.375rem 0.25rem;
            font-family: inherit;
            resize: none;
            max-height: 150px;
            overflow-y: auto;
            line-height: 1.5;
        }
        #input::placeholder { color: var(--text-secondary); }

        #send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: opacity 0.15s, transform 0.15s;
        }
        #send-btn:disabled { opacity: 0.25; cursor: not-allowed; }
        #send-btn:hover:not(:disabled) { opacity: 0.8; }
        #send-btn:active:not(:disabled) { transform: scale(0.95); }

        #footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem;
            font-size: 0.6875rem;
            color: var(--text-secondary);
        }
        #footer .powered { opacity: 0.7; }
        #footer .logos {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        #footer .logos img { height: 14px; width: auto; display: block; }
        #footer .dot { opacity: 0.4; }

        #chat::-webkit-scrollbar { width: 5px; }
        #chat::-webkit-scrollbar-track { background: transparent; }
        #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 640px) {
            header { padding: 0.75rem 1rem; }
            #input-area { padding: 0.75rem 1rem 1rem; }
        }
    </style>
</head>
<body>
    <header>
        <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
        </svg>
        <h1>Relay</h1>
        <a id="repo-link" href="https://github.com/tmoreton/tutorials" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View source on GitHub">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.29-.01-1.04-.02-2.04-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.11-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22 0 1.6-.02 2.89-.02 3.28 0 .32.22.7.83.58A12.01 12.01 0 0 0 24 12.5C24 5.87 18.63.5 12 .5z"/>
            </svg>
        </a>
    </header>

    <div id="chat"></div>

    <div id="input-area">
        <div id="input-container">
            <textarea id="input" rows="1" placeholder="Message Relay..."></textarea>
            <button id="send-btn" onclick="send()" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>

    <div id="footer">
        <span class="powered">Powered by</span>
        <span class="logos">
            <img src="assets/strands.svg" alt="Strands Agents" title="Strands Agents">
            <span>Strands Agents</span>
        </span>
        <span class="dot">&middot;</span>
        <span class="logos">
            <img src="assets/aws.svg" alt="Amazon Web Services" title="Amazon Bedrock">
            <span>Amazon Bedrock</span>
        </span>
    </div>

    <script>
        // Local dev: agentcore dev server. Production: CloudFront → Lambda proxy → AgentCore Runtime.
        const LOCAL_API = "http://localhost:8080/invocations";
        const PROD_API = "https://d1tot2sdhkxrue.cloudfront.net/";
        const API_URL = location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? LOCAL_API
            : PROD_API;

        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendBtn = document.getElementById("send-btn");

        inputEl.addEventListener("input", () => {
            inputEl.style.height = "auto";
            inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + "px";
        });

        inputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) send();
            }
        });

        // A stable session id so the agent keeps conversation history per browser tab.
        const sessionId = "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
        const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";

        // CloudFront OAC signs requests to the Lambda function URL. For POST bodies
        // the payload hash must be sent in x-amz-content-sha256, or the signature
        // won't match — Lambda function URLs don't accept unsigned payloads.
        async function sha256Hex(str) {
            const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
        }

        async function send() {
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessage("user", text);
            inputEl.value = "";
            inputEl.style.height = "auto";
            sendBtn.disabled = true;

            const row = appendMessage("assistant", "Thinking...", "thinking");
            const bubble = row.querySelector(".message-bubble");

            try {
                const body = JSON.stringify({ prompt: text });
                const headers = {
                    "Content-Type": "application/json",
                    "Accept": "text/event-stream",
                    "X-Amzn-Bedrock-AgentCore-Runtime-Session-Id": sessionId,
                };
                if (!isLocal) headers["x-amz-content-sha256"] = await sha256Hex(body);

                const res = await fetch(API_URL, {
                    method: "POST",
                    headers,
                    body,
                });
                if (!res.ok) throw new Error("HTTP " + res.status);

                // The agent streams Server-Sent Events: each `data:` line carries
                // a JSON chunk like {"data":"token"}. Concatenate as they arrive.
                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";
                let answer = "";
                let firstChunk = true;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const events = buffer.split("\n\n");
                    buffer = events.pop();  // keep any partial event for the next read

                    for (const evt of events) {
                        const line = evt.split("\n").find((l) => l.startsWith("data:"));
                        if (!line) continue;
                        const raw = line.slice(5).trim();
                        if (!raw || raw === "[DONE]") continue;
                        let piece = raw;
                        try {
                            const parsed = JSON.parse(raw);
                            piece = typeof parsed === "string" ? parsed : (parsed.data ?? parsed.result ?? "");
                        } catch { /* plain-text chunk */ }
                        if (!piece) continue;
                        answer += piece;
                        if (firstChunk) {
                            bubble.classList.remove("thinking");
                            firstChunk = false;
                        }
                        bubble.textContent = answer;
                        chatEl.scrollTop = chatEl.scrollHeight;
                    }
                }

                if (!answer) {
                    bubble.textContent = "(no response)";
                    bubble.classList.remove("thinking");
                }
            } catch (err) {
                bubble.textContent = "Something went wrong. Make sure agentcore dev is running.";
                bubble.classList.remove("thinking");
            }

            sendBtn.disabled = false;
            inputEl.focus();
        }

        function appendMessage(role, text, className = "") {
            const row = document.createElement("div");
            row.className = `message-row ${role}`;

            const bubble = document.createElement("div");
            bubble.className = `message-bubble ${className}`;
            bubble.textContent = text;

            row.appendChild(bubble);
            chatEl.appendChild(row);
            chatEl.scrollTop = chatEl.scrollHeight;
            return row;
        }

        inputEl.focus();
    </script>
</body>
</html>
